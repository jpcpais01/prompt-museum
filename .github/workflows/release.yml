name: Build & release

# Every push to main builds a signed Android APK and a single-file Windows
# .exe, then publishes both together as one GitHub release (which the in-app
# updater picks up). Pull requests build and test both without releasing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.5.1"
  APP_VERSION: "0.1.${{ github.run_number }}"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot
        run: |
          set -e
          V=$GODOT_VERSION
          mkdir -p ~/godot-dl && cd ~/godot-dl
          if [ ! -f godot ]; then
            curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${V}-stable_linux.x86_64" godot && rm g.zip
          fi
          if [ ! -f templates.tpz ]; then
            curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          fi
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          rm -rf /tmp/tpl && unzip -q -o templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/
          sudo ln -sf ~/godot-dl/godot /usr/local/bin/godot

      - name: Configure Android SDK for Godot
        run: |
          mkdir -p ~/.config/godot
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.5.tres

      - name: Signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "KS_USER=$KS_USER" >> $GITHUB_ENV
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
          else
            echo "Using the project keystore in android/release.keystore"
            echo "KS_PATH=$GITHUB_WORKSPACE/android/release.keystore" >> $GITHUB_ENV
            echo "KS_USER=promptmuseum" >> $GITHUB_ENV
            echo "KS_PASS=promptmuseum-2026" >> $GITHUB_ENV
          fi

      - name: Version
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          sed -i "s/^version\/code=.*/version\/code=${CODE}/; s/^version\/name=.*/version\/name=\"${APP_VERSION}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${APP_VERSION}\"/" project.godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Logic tests
        run: godot --headless --path . tests/logic_test.tscn

      - name: UI walk-through (fails on any script error)
        run: |
          set -o pipefail
          godot --headless --path . tests/smoke_test.tscn 2>&1 | tee smoke.log
          if grep -q "SCRIPT ERROR" smoke.log; then echo "::error::Script errors in the UI walk-through"; exit 1; fi
          grep -q "smoke: ok" smoke.log

      - name: Export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KS_PASS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ env.KS_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ env.KS_PASS }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/PromptMuseum.apk 2>&1 | tee export.log
          test -f build/PromptMuseum.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/PromptMuseum.apk

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot
        run: |
          set -e
          V=$GODOT_VERSION
          mkdir -p ~/godot-dl && cd ~/godot-dl
          if [ ! -f godot ]; then
            curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${V}-stable_linux.x86_64" godot && rm g.zip
          fi
          if [ ! -f templates.tpz ]; then
            curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          fi
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          rm -rf /tmp/tpl && unzip -q -o templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' 'templates/version.txt' -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/
          sudo ln -sf ~/godot-dl/godot /usr/local/bin/godot

      - name: Version
        run: sed -i "s/^config\/version=.*/config\/version=\"${APP_VERSION}\"/" project.godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Export single-file Windows .exe
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/PromptMuseum.exe 2>&1 | tee export.log
          test -f build/PromptMuseum.exe
          # the game data is embedded: nothing but the .exe ships
          ls -la build
          test "$(ls build | wc -l)" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/PromptMuseum.exe

  release:
    needs: [android, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          ls -la dist
          awk '/^## /{n++} n==1' PATCH_NOTES.md > release_notes.md
          printf '\n---\n**Android:** download **PromptMuseum.apk** on your phone and open it (allow installs from your browser if asked).\n\n**Windows:** download **PromptMuseum.exe** and run it. Nothing else to unzip.\n\nAlready installed? Prompt Museum offers this update inside the app.\n' >> release_notes.md
          cat release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Prompt Museum ${{ env.APP_VERSION }}
          body_path: release_notes.md
          files: |
            dist/PromptMuseum.apk
            dist/PromptMuseum.exe
          make_latest: true
